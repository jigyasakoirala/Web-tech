<!-- Question -- Without using br tag, write a vertically aligned form asking for name, city and pincode of a user. Everyone must comment -->


<!DOCTYPE html>
<html lang="en">

<head>

    <title>User Form</title>
</head>

<body>

    <!-- Main Heading -->
    <h2>User Information Form</h2>

    <!-- Form Starts -->
    <form>

        <!-- Name Field -->
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
        </div>

        <!-- City Field -->
        <div>
            <label for="city">City:</label>
            <input type="text" id="city" name="city">
        </div>

        <!-- Pincode Field -->
        <div>
            <label for="pincode">Pincode:</label>
            <input type="number" id="pincode" name="pincode">
        </div>

        <!-- Submit Button -->
        <div>
            <button type="submit">Submit</button>
        </div>

    </form>

</body>

</html>
