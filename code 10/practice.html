<!-- Create a website which shows videos of different category and audios of different categories. You can YouTube videos in an iframe using YouTube's embedding feature-->

<!DOCTYPE html>
<html lang="en">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>
    <body style="background-color: lightblue;">
        
    <!-- using video tag -->
    <h2>Anime Videos</h2>
    <video src="video1.mp4" height="255" width="150" controls></video> 
    <video src="video2.mp4" height="255" width="150" controls></video>
    <video src="video3.mp4" height="255" width="150" controls></video>


    <!-- using audio tag -->
    <h2>Audios</h2>
    <audio src="sound1.mp3" controls></audio>
    <audio src="sound2.mp3" controls></audio>  


    <!-- using iframe tag -->
    <h2>YouTube Videos</h2> 
    <iframe width="560" height="315" src="https://www.youtube.com/embed/bueBZfiCIis?si=rkAgwAKKSOsZ8SaW&amp;start=2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/mWI9FHwuyZ8?si=JoCyVIcm7IZ8gIbX&amp;start=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


</body>
</html>
